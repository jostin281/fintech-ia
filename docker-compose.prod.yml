services:
  # ── Base de datos (Producción) ──
  postgres:
    image: postgres:17-alpine
    container_name: fintech-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-fintech}
    ports:
      - "5433:5432"
    volumes:
      - fintech_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fintech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (NestJS Prod compilado) ──
  backend:
    build:
      context: ./fintech-back
      dockerfile: Dockerfile.prod
    container_name: fintech-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_prod_pass_123}@postgres:5432/${POSTGRES_DB:-fintech}?schema=public
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-prod_super_secret_jwt_key_987654321}
      SRI_PRODUCCION_HABILITADA: "true"
      SRI_DESCARGA_AUTOMATICA_HABILITADA: "true"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Angular compilado + Nginx Prod) ──
  frontend:
    build:
      context: ./fintech-frond
      dockerfile: Dockerfile.prod
    container_name: fintech-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── SRI Automatización (Python + Playwright) ──
  sri-automation:
    build: ./automatizacion-sri
    container_name: fintech-sri-automation-prod
    restart: always
    environment:
      - API_BASE_URL=http://backend:3001/api
      - RUN_INTERVAL_HOURS=12
      - RUN_ON_STARTUP=true
    volumes:
      - ./automatizacion-sri/descargas:/app/descargas
    depends_on:
      - backend

volumes:
  fintech_pgdata_prod:
