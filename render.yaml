databases:
  - name: fintech-db
    plan: free
    databaseName: fintech
    user: fintech

services:
  # ── Backend (NestJS + Prisma) ──
  - type: web
    name: fintech-back-api
    runtime: node
    plan: free
    rootDir: fintech-back
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Clave AES-256 (32 bytes en Base64) para cifrar la firma .p12.
      # Genérala tú mismo (ver instrucciones) y pégala en el dashboard de
      # Render: un valor generado al azar por Render no garantiza el
      # formato exacto de 32 bytes que exige el código.
      - key: FACTURACION_FIRMA_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      # En "false" mientras terminas de probar: ver la conversacion sobre
      # los riesgos de activar esto en un servidor real.
      - key: SRI_PRODUCCION_HABILITADA
        value: "false"
      - key: SRI_TIMEOUT_MS
        value: "30000"
      # No lo pongas en "true" sin releer RIESGOS_Y_RECOMENDACION.docx:
      # automatiza el portal del SRI, no una API oficial.
      - key: SRI_DESCARGA_AUTOMATICA_HABILITADA
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ── Frontend (Angular, build estatico -- sin usar el servidor SSR) ──
  - type: web
    name: fintech-front-app
    runtime: static
    plan: free
    rootDir: fintech-frond
    buildCommand: npm install && npm run build
    staticPublishPath: dist/fintech-frond/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
